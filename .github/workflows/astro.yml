name: Deploy Astro site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:
  schedule:
    # Wednesdays 16:00 UTC (17:00 or 18:00 Prague), after the talk ends
    - cron: "0 16 * * 3"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7

      - name: Install dependencies
        run: npm ci --quiet

      - name: Mark finished talks as past
        if: github.event_name != 'push'
        run: node scripts/mark-past.js

      - name: Set YouTube title/description and link video
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/youtube-update.js

      - name: Commit talk updates
        if: github.event_name != 'push'
        run: |
          if [[ -n "$(git status --porcelain src/content/talks)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/content/talks
            git commit -m "Update finished talk"
            git push
          fi

      - name: Sync Calendar
        if: github.ref == 'refs/heads/master'
        env:
          GOOGLE_CALENDAR_CREDENTIALS: ${{ secrets.GOOGLE_CALENDAR_CREDENTIALS }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
        run: npm run sync:calendar || echo "Calendar sync skipped or failed"

      - name: Build Astro
        run: npx --no-install astro build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
